<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="幸运大转盘抽奖程序" />
  <title>幸运大转盘</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: var(--text);
      font-size: 2rem;
      margin-bottom: 10px;
      background: var(--gradient-2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .wheel-container {
      position: relative;
      width: 350px;
      height: 350px;
      margin: 0 auto 30px;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.3),
                  0 0 60px rgba(99, 102, 241, 0.1);
    }

    .wheel-bg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      background: conic-gradient(
        from 30deg,
        #ef4444 0deg 60deg,
        #f59e0b 60deg 120deg,
        #10b981 120deg 180deg,
        #6366f1 180deg 240deg,
        #8b5cf6 240deg 300deg,
        #ec4899 300deg 360deg
      );
    }

    .wheel-labels {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .label {
      position: absolute;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      /* 定位到圆心，旋转中心也在圆心 */
      left: 50%;
      top: 50%;
      margin-left: -30px;
      margin-top: -30px;
      /* 关键：transform-origin 在圆心，先旋转再向外平移 */
      transform-origin: center center;
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background: var(--gradient-1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 1rem;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      z-index: 10;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .wheel-center:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
    }

    .wheel-center.spinning {
      cursor: not-allowed;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 50px;
      background: var(--secondary);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      z-index: 15;
      filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.4));
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .rules {
      margin-top: 30px;
      padding: 20px;
      background: var(--card);
      border-radius: 12px;
    }

    .rules h3 {
      color: var(--text);
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .rules p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .result-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }

    .result-modal.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--card);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.5rem;
      color: var(--secondary);
      margin-bottom: 15px;
      font-weight: bold;
    }

    .modal-prize {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 10px;
    }

    .modal-text {
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .modal-btn {
      padding: 14px 40px;
      background: var(--gradient-1);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    @media (max-width: 480px) {
      .wheel-container {
        width: 280px;
        height: 280px;
      }

      .wheel-center {
        width: 60px;
        height: 60px;
        font-size: 0.85rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .modal-content {
        padding: 30px 20px;
      }

      .modal-prize {
        font-size: 1.4rem;
      }

      .label {
        font-size: 0.7rem;
        width: 45px;
        height: 45px;
        margin-left: -22.5px;
        margin-top: -22.5px;
        /* 移动端向外平移距离减小 */
        transform: rotate(var(--angle, 0deg)) translateY(-70px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎰 幸运大转盘</h1>
    <p class="subtitle">点击中心按钮开始抽奖，祝你好运！</p>

    <div class="wheel-container">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <div class="wheel-bg"></div>
        <div class="wheel-labels" id="wheelLabels"></div>
      </div>
      <div class="wheel-center" id="spinBtn">开始<br>抽奖</div>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalSpins">0</div>
        <div class="stat-label">抽奖次数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalWins">0</div>
        <div class="stat-label">中奖次数</div>
      </div>
    </div>

    <div class="rules">
      <h3>📋 抽奖规则</h3>
      <p>
        奖品包括：电视机、收音机、洗衣机、MP3、手机、平板电脑<br>
        每次抽奖都有机会获得任意奖品，祝您满载而归！
      </p>
    </div>
  </div>

  <!-- 中奖弹窗 -->
  <div class="result-modal" id="resultModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <div class="modal-title">恭喜你中奖了！</div>
      <div class="modal-prize" id="modalPrize">奖品名称</div>
      <p class="modal-text">感谢您的参与，祝您生活愉快！</p>
      <button class="modal-btn" onclick="closeModal()">再抽一次</button>
    </div>
  </div>

  <script>
    // 奖品配置 - 6个奖品
    const prizes = [
      { name: '电视机', icon: '📺', color: '#ef4444', probability: 10 },
      { name: '收音机', icon: '📻', color: '#f59e0b', probability: 20 },
      { name: '洗衣机', icon: '🧺', color: '#10b981', probability: 8 },
      { name: 'MP3', icon: '🎵', color: '#6366f1', probability: 25 },
      { name: '手机', icon: '📱', color: '#8b5cf6', probability: 12 },
      { name: '平板电脑', icon: '💻', color: '#ec4899', probability: 25 }
    ];

    // 统计
    let totalSpins = parseInt(localStorage.getItem('totalSpins') || '0');
    let totalWins = parseInt(localStorage.getItem('totalWins') || '0');

    // 转盘状态
    let isSpinning = false;
    let currentRotation = 0;

    // 初始化转盘标签
    function initWheel() {
      const labelsContainer = document.getElementById('wheelLabels');
      labelsContainer.innerHTML = '';

      prizes.forEach((prize, index) => {
        const label = document.createElement('div');
        label.className = 'label';
        
        // 每个扇区60度，第i个扇区中心在 30 + i*60 度
        // 旋转后向外平移 100px，这样每个 label 会在不同的位置
        const angle = index * 60 + 30;
        label.style.transform = `rotate(${angle}deg) translateY(-100px)`;
        label.innerHTML = `${prize.icon}<br>${prize.name}`;
        labelsContainer.appendChild(label);
      });

      updateStats();
    }

    // 根据概率选择奖品
    function selectPrize() {
      const rand = Math.random() * 100;
      let cumulative = 0;

      for (const prize of prizes) {
        cumulative += prize.probability;
        if (rand < cumulative) {
          return prize;
        }
      }

      return prizes[prizes.length - 1];
    }

    // 抽奖
    function spin() {
      if (isSpinning) return;

      isSpinning = true;
      const spinBtn = document.getElementById('spinBtn');
      spinBtn.classList.add('spinning');
      spinBtn.innerHTML = '抽奖中...';

      // 选择奖品
      const prize = selectPrize();
      const prizeIndex = prizes.indexOf(prize);

      // 计算旋转角度
      const baseSpins = 5;
      const segmentAngle = 360 / prizes.length;

      // conic-gradient 从 30deg 开始
      // 指针在顶部（270度）
      // 目标：让第 prizeIndex 个扇区中心转到 270度
      // 扇区中心初始角度 = 30 + prizeIndex * 60
      // 需要的旋转 = 270 - (30 + prizeIndex * 60) + extraSpins * 360
      const sectorCenter = 30 + prizeIndex * segmentAngle;
      const targetRotation = 270 - sectorCenter + 360 + baseSpins * 360;

      currentRotation += targetRotation;

      // 应用旋转
      const wheel = document.getElementById('wheel');
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      // 更新统计
      totalSpins++;
      localStorage.setItem('totalSpins', totalSpins);

      // 4秒后显示结果
      setTimeout(() => {
        isSpinning = false;
        spinBtn.classList.remove('spinning');
        spinBtn.innerHTML = '开始<br>抽奖';

        totalWins++;
        localStorage.setItem('totalWins', totalWins);
        updateStats();

        showResult(prize);
      }, 4000);
    }

    // 显示结果
    function showResult(prize) {
      const modal = document.getElementById('resultModal');
      const modalPrize = document.getElementById('modalPrize');

      modalPrize.innerHTML = `${prize.icon} ${prize.name}`;
      modal.classList.add('show');
    }

    // 关闭弹窗
    function closeModal() {
      const modal = document.getElementById('resultModal');
      modal.classList.remove('show');
    }

    // 更新统计
    function updateStats() {
      document.getElementById('totalSpins').textContent = totalSpins;
      document.getElementById('totalWins').textContent = totalWins;
    }

    // 初始化
    document.getElementById('spinBtn').addEventListener('click', spin);

    // 点击弹窗外部关闭
    document.getElementById('resultModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('resultModal')) {
        closeModal();
      }
    });

    // ESC 关闭弹窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // 初始化转盘
    initWheel();

    // 调试信息
    console.log('✅ 幸运大转盘已加载');
    console.log('📋 奖品列表:');
    prizes.forEach((p, i) => {
      console.log(`  ${i}: ${p.name} (${p.probability}%) - 中心角 ${30 + i * 60}°`);
    });
    console.log('🔝 指针在顶部（270°）');
    console.log('🎯 conic-gradient 从 30° 开始');
  </script>
</body>
</html>
