<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="一款现代简洁的待办清单应用" />
  <title>待办清单</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      font-weight: 400;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      --bg: #f0f2f5;
      --bg-accent: #e8f0fe;
      --card: #ffffff;
      --surface: #f7f9fc;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-soft: #dbeafe;
      --success: #10b981;
      --success-soft: #d1fae5;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --warning: #f59e0b;
      --border: #e5e7eb;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-accent: rgba(59, 130, 246, 0.2);
      --card: #1e293b;
      --surface: #334155;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --muted: #64748b;
      --primary: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.2);
      --success: #34d399;
      --success-soft: rgba(16, 185, 129, 0.2);
      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.2);
      --warning: #fbbf24;
      --border: #334155;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      background: var(--primary-soft);
      transform: scale(1.05);
    }

    .stats {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--card);
      padding: 12px 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .stat-value {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .add-task {
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    .task-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--surface);
      color: var(--text);
      transition: var(--transition);
    }

    .task-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .task-input::placeholder {
      color: var(--muted);
    }

    .add-btn {
      padding: 14px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: none;
      background: var(--surface);
      color: var(--text-secondary);
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      background: var(--card);
      padding: 16px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .checkbox:hover {
      border-color: var(--success);
      background: var(--success-soft);
    }

    .checkbox.checked {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
      color: var(--text);
      word-break: break-word;
      transition: var(--transition);
    }

    .task-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: var(--transition);
    }

    .task-item:hover .task-actions {
      opacity: 1;
    }

    .action-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .edit-btn {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .edit-btn:hover {
      background: var(--primary);
      color: white;
    }

    .delete-btn {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .delete-btn:hover {
      background: var(--danger);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 1.1rem;
    }

    .edit-input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid var(--primary);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--surface);
      color: var(--text);
    }

    .edit-input:focus {
      outline: none;
    }

    .clear-completed {
      margin-top: 20px;
      padding: 12px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius);
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      display: none;
    }

    .clear-completed:hover {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger);
    }

    .clear-completed.show {
      display: inline-block;
    }

    @media (max-width: 480px) {
      .input-group {
        flex-direction: column;
      }

      .add-btn {
        width: 100%;
      }

      .task-actions {
        opacity: 1;
      }

      .stats {
        justify-content: center;
      }

      header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 待办清单</h1>
      <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
    </header>

    <div class="stats">
      <div class="stat">
        <span>全部:</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat">
        <span>已完成:</span>
        <span class="stat-value" id="completedCount">0</span>
      </div>
      <div class="stat">
        <span>进行中:</span>
        <span class="stat-value" id="activeCount">0</span>
      </div>
    </div>

    <div class="add-task">
      <div class="input-group">
        <input type="text" class="task-input" id="taskInput" placeholder="添加新的待办事项..." />
        <button class="add-btn" id="addBtn">添加</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">进行中</button>
      <button class="filter-btn" data-filter="completed">已完成</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon">📋</div>
      <p class="empty-state-text">暂无待办事项</p>
    </div>

    <button class="clear-completed" id="clearCompleted">清除已完成事项</button>
  </div>

  <script>
    // Todo List 应用
    class TodoApp {
      constructor() {
        this.tasks = this.loadTasks();
        this.currentFilter = 'all';
        this.editingId = null;

        // DOM 元素
        this.taskInput = document.getElementById('taskInput');
        this.addBtn = document.getElementById('addBtn');
        this.taskList = document.getElementById('taskList');
        this.emptyState = document.getElementById('emptyState');
        this.themeToggle = document.getElementById('themeToggle');
        this.clearCompletedBtn = document.getElementById('clearCompleted');
        this.filterBtns = document.querySelectorAll('.filter-btn');

        // 统计元素
        this.totalCount = document.getElementById('totalCount');
        this.completedCount = document.getElementById('completedCount');
        this.activeCount = document.getElementById('activeCount');

        this.init();
      }

      init() {
        // 事件监听
        this.addBtn.addEventListener('click', () => this.addTask());
        this.taskInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') this.addTask();
        });

        this.themeToggle.addEventListener('click', () => this.toggleTheme());
        this.clearCompletedBtn.addEventListener('click', () => this.clearCompleted());

        this.filterBtns.forEach(btn => {
          btn.addEventListener('click', () => this.setFilter(btn.dataset.filter));
        });

        // 初始化主题
        this.initTheme();
        // 渲染任务
        this.render();
      }

      loadTasks() {
        const saved = localStorage.getItem('todoTasks');
        return saved ? JSON.parse(saved) : [];
      }

      saveTasks() {
        localStorage.setItem('todoTasks', JSON.stringify(this.tasks));
      }

      generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
      }

      addTask() {
        const text = this.taskInput.value.trim();
        if (!text) return;

        const task = {
          id: this.generateId(),
          text: text,
          completed: false,
          createdAt: new Date().toISOString()
        };

        this.tasks.unshift(task);
        this.saveTasks();
        this.taskInput.value = '';
        this.render();
      }

      toggleTask(id) {
        const task = this.tasks.find(t => t.id === id);
        if (task) {
          task.completed = !task.completed;
          this.saveTasks();
          this.render();
        }
      }

      deleteTask(id) {
        this.tasks = this.tasks.filter(t => t.id !== id);
        this.saveTasks();
        this.render();
      }

      startEdit(id) {
        const task = this.tasks.find(t => t.id === id);
        if (!task) return;

        this.editingId = id;
        this.render();

        // 自动聚焦编辑框
        setTimeout(() => {
          const editInput = document.querySelector('.edit-input');
          if (editInput) {
            editInput.focus();
            editInput.setSelectionRange(editInput.value.length, editInput.value.length);
          }
        }, 0);
      }

      saveEdit(id, newText) {
        const task = this.tasks.find(t => t.id === id);
        if (task && newText.trim()) {
          task.text = newText.trim();
        }
        this.editingId = null;
        this.saveTasks();
        this.render();
      }

      cancelEdit() {
        this.editingId = null;
        this.render();
      }

      setFilter(filter) {
        this.currentFilter = filter;
        this.filterBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        this.render();
      }

      getFilteredTasks() {
        switch (this.currentFilter) {
          case 'active':
            return this.tasks.filter(t => !t.completed);
          case 'completed':
            return this.tasks.filter(t => t.completed);
          default:
            return this.tasks;
        }
      }

      clearCompleted() {
        this.tasks = this.tasks.filter(t => !t.completed);
        this.saveTasks();
        this.render();
      }

      updateStats() {
        const total = this.tasks.length;
        const completed = this.tasks.filter(t => t.completed).length;
        const active = total - completed;

        this.totalCount.textContent = total;
        this.completedCount.textContent = completed;
        this.activeCount.textContent = active;

        // 显示/隐藏清除按钮
        this.clearCompletedBtn.classList.toggle('show', completed > 0);
      }

      render() {
        const filteredTasks = this.getFilteredTasks();

        // 更新统计
        this.updateStats();

        // 显示/隐藏空状态
        const hasTasks = filteredTasks.length > 0;
        this.emptyState.style.display = hasTasks ? 'none' : 'block';
        this.taskList.style.display = hasTasks ? 'block' : 'none';

        // 渲染任务列表
        this.taskList.innerHTML = filteredTasks.map(task => this.renderTask(task)).join('');

        // 绑定事件
        this.bindTaskEvents();
      }

      renderTask(task) {
        const isEditing = this.editingId === task.id;

        return `
          <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
            <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="app.toggleTask('${task.id}')">
              ${task.completed ? '✓' : ''}
            </div>
            ${isEditing
              ? `<input type="text" class="edit-input" value="${this.escapeHtml(task.text)}" onkeypress="if(event.key==='Enter')app.saveEdit('${task.id}', this.value)"/>
               <button class="action-btn edit-btn" onclick="app.saveEdit('${task.id}', document.querySelector('.edit-input').value)">✓</button>
               <button class="action-btn delete-btn" onclick="app.cancelEdit()">✕</button>`
              : `<span class="task-text">${this.escapeHtml(task.text)}</span>
               <div class="task-actions">
                 <button class="action-btn edit-btn" onclick="app.startEdit('${task.id}')">编辑</button>
                 <button class="action-btn delete-btn" onclick="app.deleteTask('${task.id}')">删除</button>
               </div>`
            }
          </li>
        `;
      }

      bindTaskEvents() {
        // 失去焦点时保存编辑
        const editInput = document.querySelector('.edit-input');
        if (editInput) {
          editInput.addEventListener('blur', () => {
            if (this.editingId) {
              this.saveEdit(this.editingId, editInput.value);
            }
          });
        }
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          this.themeToggle.textContent = '☀️';
        }
      }

      toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
          this.themeToggle.textContent = '🌙';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          this.themeToggle.textContent = '☀️';
        }
      }
    }

    // 初始化应用
    const app = new TodoApp();

    // 测试功能
    console.log('✅ Todo List 应用已加载');
    console.log('📋 功能列表:');
    console.log('  - 添加任务');
    console.log('  - 标记完成/未完成');
    console.log('  - 编辑任务');
    console.log('  - 删除任务');
    console.log('  - 筛选任务（全部/进行中/已完成）');
    console.log('  - 清除已完成任务');
    console.log('  - 主题切换（浅色/深色）');
    console.log('  - 本地存储持久化');
    console.log('  - 响应式设计');
  </script>
</body>
</html>
