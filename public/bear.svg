<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140">
  <defs>
    <linearGradient id="fur" x1="0" x2="1">
      <stop offset="0" stop-color="#C08457"/>
      <stop offset="1" stop-color="#8B5E3C"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="110" cy="128" rx="70" ry="10" fill="rgba(15,23,42,0.20)"/>

  <!-- body -->
  <ellipse cx="120" cy="88" rx="52" ry="40" fill="url(#fur)"/>
  <ellipse cx="120" cy="95" rx="34" ry="26" fill="rgba(255,255,255,0.18)"/>

  <!-- head -->
  <circle cx="74" cy="64" r="34" fill="url(#fur)"/>
  <!-- ears -->
  <circle cx="50" cy="40" r="14" fill="url(#fur)"/>
  <circle cx="92" cy="34" r="14" fill="url(#fur)"/>
  <circle cx="52" cy="42" r="8" fill="rgba(255,255,255,0.18)"/>
  <circle cx="94" cy="36" r="8" fill="rgba(255,255,255,0.18)"/>

  <!-- face -->
  <circle cx="62" cy="60" r="4" fill="#0f172a"/>
  <circle cx="86" cy="58" r="4" fill="#0f172a"/>
  <ellipse cx="74" cy="74" rx="12" ry="9" fill="rgba(255,255,255,0.25)"/>
  <circle cx="74" cy="72" r="4" fill="#0f172a"/>
  <path d="M70 78c2 4 8 4 10 0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- legs -->
  <ellipse cx="102" cy="120" rx="16" ry="14" fill="url(#fur)"/>
  <ellipse cx="140" cy="120" rx="16" ry="14" fill="url(#fur)"/>

  <!-- arms (pushing) -->
  <path d="M90 86c-18 6-26 20-28 30" stroke="url(#fur)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M112 84c-10 14-6 28-2 38" stroke="url(#fur)" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- sweat drop -->
  <path d="M98 40c8 10 3 18-4 20c-7-2-12-10-4-20z" fill="#38bdf8" opacity="0.9"/>
</svg>
